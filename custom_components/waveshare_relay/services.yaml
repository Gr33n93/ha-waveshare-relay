funktionstest_start:
  name: Funktionstest starten
  description: >
    Startet einen One-Hot-Funktionstest: Jeder Kanal wird nacheinander ein-
    und wieder ausgeschaltet. Ohne Geräteauswahl laufen alle Boards.
  fields:
    laufzeit_s:
      name: Laufzeit pro Kanal (s)
      description: Wie lange jedes Relais eingeschaltet bleibt.
      required: false
      default: 5
      selector:
        number:
          min: 0.1
          max: 300
          step: 0.1
          unit_of_measurement: s
    pause_s:
      name: Pause zwischen Kanälen (s)
      description: Wartezeit nach dem Ausschalten bevor der nächste Kanal drankommt.
      required: false
      default: 0.25
      selector:
        number:
          min: 0
          max: 60
          step: 0.05
          unit_of_measurement: s
    einmalig:
      name: Nur ein Durchlauf
      description: >
        Wenn aktiv, wird der Test nach einem kompletten Durchlauf beendet.
        Sonst Endlosschleife bis manuell gestoppt.
      required: false
      default: true
      selector:
        boolean:
    device_id:
      name: Gerät
      description: >
        Board, auf dem der Test läuft. Leer lassen für alle Boards.
        Während des Tests sind manuelle Schaltbefehle gesperrt.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

funktionstest_stop:
  name: Funktionstest stoppen
  description: >
    Stoppt einen laufenden Funktionstest und schaltet alle Relais aus.
    Ohne Geräteauswahl auf allen Boards.
  fields:
    device_id:
      name: Gerät
      description: Board, dessen Test gestoppt wird. Leer lassen für alle Boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

statistik_zuruecksetzen:
  name: Statistik zurücksetzen
  description: >
    Setzt alle Zähler und Dauer-Werte auf 0 zurück.
    Ohne Geräteauswahl auf allen Boards.
  fields:
    device_id:
      name: Gerät
      description: Board, dessen Statistik zurückgesetzt wird. Leer lassen für alle Boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

alle_aus:
  name: Alle Relais aus
  description: >
    Schaltet alle Relais sofort aus. Ohne Geräteauswahl auf allen Boards.
    Bleibt auch während eines Funktionstests verfügbar (Sicherheitsstopp).
  fields:
    device_id:
      name: Gerät
      description: Board, das ausgeschaltet wird. Leer lassen für alle Boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay
