funktionstest_start:
  name: Start function test
  description: >
    Starts a one-hot function test: every channel is switched on and
    off in turn. Without a device target all boards run.
  fields:
    laufzeit_s:
      name: Runtime per channel (s)
      description: How long each relay stays switched on.
      required: false
      default: 5
      selector:
        number:
          min: 0.1
          max: 300
          step: 0.1
          unit_of_measurement: s
    pause_s:
      name: Pause between channels (s)
      description: Wait time after switch-off before the next channel.
      required: false
      default: 0.25
      selector:
        number:
          min: 0
          max: 60
          step: 0.05
          unit_of_measurement: s
    einmalig:
      name: Single pass
      description: >
        If enabled, the test ends after one complete pass. Otherwise it
        loops until stopped manually.
      required: false
      default: true
      selector:
        boolean:
    device_id:
      name: Device
      description: >
        Board the test runs on. Leave empty for all boards. Manual
        switch commands are blocked while the test runs.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

funktionstest_stop:
  name: Stop function test
  description: >
    Stops a running function test and switches all relays off.
    Without a device target on all boards.
  fields:
    device_id:
      name: Device
      description: Board whose test is stopped. Leave empty for all boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

statistik_zuruecksetzen:
  name: Reset statistics
  description: >
    Resets all counters and duration values to 0. Without a device
    target on all boards.
  fields:
    device_id:
      name: Device
      description: Board whose statistics are reset. Leave empty for all boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay

alle_aus:
  name: All relays off
  description: >
    Switches all relays off immediately. Without a device target on all
    boards. Stays available during a function test (safety stop).
  fields:
    device_id:
      name: Device
      description: Board that is switched off. Leave empty for all boards.
      required: false
      selector:
        device:
          filter:
            - integration: waveshare_relay
