name: Tests

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (pymodbus ${{ matrix.pymodbus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pymodbus: ["3.13.1", "3.16.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"

      - name: Install dependencies
        run: |
          python -m pip install "homeassistant==2026.11.3" "pymodbus==${{ matrix.pymodbus }}" \
            "pytest==9.2.0" "pytest-asyncio==1.5.0"

      - name: Run tests
        run: python -m pytest -v
